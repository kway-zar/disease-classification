[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disease-classification"
version = "0.0.1"
description = "Streamlit component that allows you to do X"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "kway-zar", email = "jgdcruz06@gmail.com" }]
dependencies = ["streamlit >= 1.51", "streamlit-shadcn-ui", "st_tailwind", "scikit-learn >= 1.2"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["disease_classification*", "models*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
disease_classification = ["frontend/build/**/*", "pyproject.toml"]
